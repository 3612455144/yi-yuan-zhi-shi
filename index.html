<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0ebdf">
  <meta name="description" content="沿节气尺观察一座农家小院的四时农事。">
  <title>一院知时</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-season="grain">
  <main class="exhibit">
    <aside class="side-panel" aria-label="节气导览">
      <header class="mast">
        <h1 id="work-title">一院知时</h1>
        <p>农家小院的四时农事</p>
      </header>
      <nav class="calendar" aria-labelledby="ruler-heading">
        <div class="ruler-heading">
          <h2 id="ruler-heading">节气尺</h2>
          <span class="ruler-count"><span id="term-number">09</span> / 24</span>
        </div>
        <p class="ruler-sub">四季四景 · 各择一气入院</p>
        <div class="ruler-window">
          <div class="ruler-cursor" aria-hidden="true"></div>
          <div id="terms" class="terms" style="--ruler-index: 8">
            <span class="calendar-mark">立春</span>
            <button class="term" type="button" tabindex="-1" data-season="rain"><span class="term-name">雨水</span><small lang="en">Rain Water</small></button>
            <span class="calendar-mark">惊蛰</span>
            <span class="calendar-mark">春分</span>
            <span class="calendar-mark">清明</span>
            <span class="calendar-mark">谷雨</span>
            <span class="calendar-mark">立夏</span>
            <span class="calendar-mark">小满</span>
            <button class="term" type="button" tabindex="-1" data-season="grain" aria-current="true"><span class="term-name">芒种</span><small lang="en">Grain in Ear</small></button>
            <span class="calendar-mark">夏至</span>
            <span class="calendar-mark">小暑</span>
            <span class="calendar-mark">大暑</span>
            <span class="calendar-mark">立秋</span>
            <span class="calendar-mark">处暑</span>
            <span class="calendar-mark">白露</span>
            <span class="calendar-mark">秋分</span>
            <button class="term" type="button" tabindex="-1" data-season="dew"><span class="term-name">寒露</span><small lang="en">Cold Dew</small></button>
            <span class="calendar-mark">霜降</span>
            <span class="calendar-mark">立冬</span>
            <button class="term" type="button" tabindex="-1" data-season="winter"><span class="term-name">小雪</span><small lang="en">Minor Snow</small></button>
            <span class="calendar-mark">大雪</span>
            <span class="calendar-mark">冬至</span>
            <span class="calendar-mark">小寒</span>
            <span class="calendar-mark">大寒</span>
          </div>
        </div>
        <div class="yard-links" role="group" aria-label="四个小院场景">
          <span aria-hidden="true">入院</span>
          <button type="button" data-yard="rain">雨水</button>
          <button type="button" data-yard="grain" aria-current="true">芒种</button>
          <button type="button" data-yard="dew">寒露</button>
          <button type="button" data-yard="winter">小雪</button>
        </div>
      </nav>
      <div class="season-note" aria-live="polite" aria-atomic="true">
        <p id="term-note">芒种忙栽秧。田里留一层浅水，透过水能看见泥底和刚栽下的稻秧。</p>
      </div>
      <div class="season-observations">
        <section class="season-palette" aria-labelledby="palette-heading">
          <h2 id="palette-heading">节气传统色</h2>
          <ul class="swatches">
            <li><i aria-hidden="true"></i><span></span></li>
            <li><i aria-hidden="true"></i><span></span></li>
            <li><i aria-hidden="true"></i><span></span></li>
          </ul>
        </section>
        <figure class="sundial" id="sundial">
          <figcaption>田头正午日影</figcaption>
          <svg class="sun-diagram" viewBox="8 12 60 50" aria-hidden="true">
            <path class="sq-arc" d="M12 33A14 14 0 0 1 26 19"/>
            <circle class="sun" cx="26" cy="33" r="2.8"/>
            <path class="sq-ground" d="M17 56H66"/>
            <path class="sq-gnomon" d="M26 56V33"/>
            <rect class="sq-shadow" x="26" y="54.4" height="3.2" rx="1" width="3"/>
            <path class="sq-ref" d="M30.8 52V60M49 49.5V62M57.5 52V60"/>
          </svg>
          <span id="shadow-ratio"><b>0.14</b><span>× 竿高</span></span>
          <span class="sundial-extremes">夏至 0.12 · 冬至 1.37</span>
        </figure>
      </div>
    </aside>
    <section class="stage" aria-label="农家小院">
      <svg class="landscape" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop offset="0" stop-color="var(--sky-top)"/>
            <stop offset="1" stop-color="var(--sky-haze)"/>
          </linearGradient>
          <linearGradient id="river" x2="0" y2="1">
            <stop offset="0" stop-color="var(--sky-haze)"/>
            <stop offset="1" stop-color="var(--river)"/>
          </linearGradient>
          <radialGradient id="sun-aura">
            <stop offset="0" stop-color="var(--sun-disc)" stop-opacity=".76"/>
            <stop offset=".36" stop-color="var(--sun-disc)" stop-opacity=".26"/>
            <stop offset="1" stop-color="var(--sun-disc)" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="ridge-mist" x2="0" y2="1">
            <stop offset="0" stop-color="var(--sky-haze)" stop-opacity="0"/>
            <stop offset=".66" stop-color="var(--sky-haze)" stop-opacity=".73"/>
            <stop offset="1" stop-color="var(--sky-haze)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path fill="url(#sky)" d="M0 0h1200v900H0z"/>
        <g class="landscape-sun">
          <circle cx="946" cy="181" r="112" fill="url(#sun-aura)"/>
          <circle cx="946" cy="181" r="26" fill="var(--sun-disc)"/>
        </g>
        <g fill="none" stroke="var(--sky-haze)" stroke-linecap="round" opacity=".46">
          <path d="M1013 252h116m-82-12h48" stroke-width="2"/>
          <path d="M260 220h94m14 0h19m460 43h48" stroke-width="1.4"/>
        </g>
        <path fill="var(--ridge-far)" d="M0 355C83 332 135 279 209 292c33 6 66 42 105 46 44 5 81-41 124-43 46-3 65 35 108 40 42 5 67-33 104-36 40-3 63 28 101 35 47 8 72-44 123-51 56-8 82 25 127 21 69-6 101-45 199-49v223H0z"/>
        <path class="landscape-mist" fill="url(#ridge-mist)" d="M0 267h1200v169H0z"/>
        <path fill="var(--ridge-near)" d="M0 329c75-4 132 36 198 48 76 13 116-22 183-19 60 3 106 34 184 32 85-3 114-39 187-44 61-5 101 29 165 27 89-3 153-71 283-69v193H0z"/>
        <path fill="url(#river)" d="M0 421c146 63 248-23 418-17 135 5 178 30 284 24 111-6 219-76 498-49v521H0z"/>
        <path fill="var(--bank-far)" d="M0 473c156-17 172-65 312-51 112 11 145 22 263 13-73 26-193 15-247 24-89 15-106 55-214 68-41 5-76 5-114 7zm1200-55c-147-2-248 7-348 39 132-8 181 34 348 35z"/>
        <path fill="var(--bank-near)" d="M0 687c91-29 156 1 244-17-69 42-139 57-244 61zm1200-134c-144 38-168 125-297 157-61 15-131 27-189 47 99-16 216-6 309-31 69-18 122-49 177-49zm0 306c-179-9-348 19-536 41h536z"/>
        <path class="landscape-mist" fill="url(#ridge-mist)" d="M0 345h1200v165H0z"/>
        <g fill="none" stroke="var(--water-line)" stroke-linecap="round" stroke-width="1.5" opacity=".65">
          <path d="M1001 524c50-8 105-9 172-6m-113 14c36-4 59-3 83-3m-183 247c76-9 127-40 197-49m-146 62c65-13 82-27 125-34"/>
        </g>
      </svg>
      <svg id="yard-shadow" aria-hidden="true"><polygon id="plinth-shadow"/></svg>
      <canvas id="yard-compatibility" aria-hidden="true" hidden></canvas>
      <canvas id="yard" tabindex="0" aria-label="三维农家小院。拖动旋转，滚动缩放，右键拖动平移，键盘方向键旋转。"></canvas>
      <footer class="stage-footer">
        <div class="view-hint"><span class="mouse-hint">拖动旋转 · 滚轮缩放</span><span class="touch-hint">滑动画面旋转 · 双指缩放</span></div>
        <div class="view-controls" aria-label="小院视角">
          <button id="zoom-out" type="button" aria-label="缩小" title="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="reset-view" type="button" aria-label="复位视角" title="复位视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v6h6M4.4 10.2a8 8 0 1 1 1 7.3"/></svg></button>
          <button id="zoom-in" type="button" aria-label="放大" title="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7v14"/></svg></button>
        </div>
      </footer>
      <p class="renderer-message" id="renderer-message" hidden>浏览器暂时无法显示三维场景。</p>
    </section>
    <div id="season-interlude" class="season-interlude" aria-hidden="true">
      <svg class="interlude-landscape" viewBox="0 0 1000 480" preserveAspectRatio="xMidYMax slice">
        <path d="M0 416c105-17 169-57 258-55 98 2 174 41 272 33 108-10 181-69 274-59 83 9 118 36 196 42v103H0Z" fill="currentColor"/>
        <path d="M0 451c102-11 172-47 263-43 77 3 157 35 254 30 119-7 202-52 294-43 74 7 125 38 189 41v44H0Z" fill="#060e16"/>
      </svg>
      <div class="interlude-composition">
        <svg id="term-dial" class="term-dial" viewBox="-220 -220 440 440" focusable="false">
          <circle r="176" class="dial-minute-ring"/>
          <circle r="166" class="dial-ring"/>
          <g id="dial-rotor">
            <path id="dial-diameters" class="dial-diameters"/>
            <g id="dial-fans"></g>
          </g>
          <circle r="15" class="dial-hub-ring"/>
          <path d="M0-10 2.7-2.7 10 0 2.7 2.7 0 10-2.7 2.7-10 0-2.7-2.7Z" class="dial-hub"/>
          <path d="M-6-215 0-205 6-215Z" class="dial-pointer"/>
        </svg>
        <div class="interlude-text">
          <p id="interlude-name" class="interlude-name"></p>
          <p id="interlude-english" class="interlude-english" lang="en"></p>
          <p id="interlude-longitude" class="interlude-longitude"></p>
          <p id="interlude-verse" class="interlude-verse"></p>
        </div>
      </div>
    </div>
  </main>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
